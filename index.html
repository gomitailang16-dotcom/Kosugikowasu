<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><title>G1 World Classic Glory - 1無量大数Edition</title>
<style>
body{margin:0;font:16px -apple-system,sans-serif;background:#10231a;color:#eee}
header,nav{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0a1810}header b{flex:1}
button{font-size:16px;padding:10px 14px;margin:3px;border:0;border-radius:8px;background:#2d5a44;color:#fff;cursor:pointer}
button.on{background:#d4a017;color:#000}button.s{background:#a33}.c{color:#ffd34d;font-weight:700}
main{padding:10px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #2a4}
.box{max-width:360px;margin:15vh auto;text-align:center}input{font-size:18px;padding:10px;margin:6px;width:80%;border-radius:8px;border:0}
.card{background:#183626;border-radius:10px;padding:10px;margin:8px 0}.n{display:inline-block;min-width:26px;text-align:center;border-radius:50%;background:#fff;color:#000}
.sel{background:#d4a017}canvas{width:100%;border-radius:8px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://cntqlqvnruanmawtxiyp.supabase.co', KEY='sb_publishable_28BRrTAEoLeyOgcOCvc9FA_hg5Ej2wC';
const sb=supabase.createClient(SB_URL,KEY),$=s=>document.querySelector(s);

// 1無量大数の定義 (10^68)
const MURYOU_TAISU = 10n**68n;

// 超巨大数値を単位（無量大数、不可思議、兆、億など）付きで表示するフォーマッタ
const y = n => {
  try {
    let b = BigInt(typeof n === 'string' ? n.split('.')[0] : Math.floor(Number(n) || 0));
    if (b === 0n) return '0';
    const units = [
      [10n**68n, '無量大数'], [10n**64n, '不可思議'], [10n**60n, '那由他'],
      [10n**56n, '阿僧祇'], [10n**52n, '恒河沙'], [10n**48n, '極'],
      [10n**44n, '載'], [10n**40n, '正'], [10n**36n, '澗'],
      [10n**32n, '溝'], [10n**28n, '穣'], [10n**24n, '𥝱'],
      [10n**20n, '垓'], [10n**16n, '京'], [10n**12n, '兆'],
      [10n**8n, '億'], [10n**4n, '万']
    ];
    for (const [val, name] of units) {
      if (b >= val) {
        const main = b / val;
        const rest = (b % val) / (val / 10n);
        return rest > 0n ? `${main}.${rest}${name}` : `${main}${name}`;
      }
    }
    return b.toLocaleString();
  } catch(e) {
    return String(n);
  }
};

const TN={win:'単勝',exacta:'馬単',quinella:'馬連',trifecta:'3連単',trio:'3連複'},K={win:1,exacta:2,quinella:2,trifecta:3,trio:3};
let me=null,D={races:[],horses:[],bets:[]},st={tab:'race'},sel={rid:0,type:'win',picks:[],amt:100};

function login(){$('#app').innerHTML=`<div class=box><h2>🏇 G1 World Classic Glory</h2>
<p style="color:#ffd34d;font-weight:bold;">✨ 競馬参加で全員に【1無量大数🪙】進呈！</p>
<input id=u placeholder="アカウント名(英数字)"><input id=pw type=password placeholder="パスワード(6文字以上)">
<button onclick="auth(0)">ログイン</button><button onclick="auth(1)">新規登録(🪙10000プレゼント)</button></div>`}

async function auth(su){const u=$('#u').value.trim(),password=$('#pw').value,email=u+'@gwc-game.com';
 const r=su?await sb.auth.signUp({email,password,options:{data:{name:u}}}):await sb.auth.signInWithPassword({email,password});
 if(r.error)alert(r.error.message)}
sb.auth.onAuthStateChange((_,s)=>{me=s?s.user:null;me?load():login()});

async function load(){
 await sb.rpc('tick');
 const bn=await sb.rpc('claim_bonus');if(bn.data>0)alert('🎁 ログインボーナス! 🪙'+bn.data+'獲得');
 const [p,r,h,b]=await Promise.all([sb.from('profiles').select('*').eq('id',me.id).single(),
  sb.from('races').select('*,entries(*)').order('id',{ascending:false}).limit(6),
  sb.from('horses').select('*').order('price',{ascending:false}),
  sb.from('bets').select('*').order('id',{ascending:false}).limit(40)]);
 D={p:p.data,races:r.data||[],horses:h.data||[],bets:b.data||[]};render()}

async function act(fn,a){
  // 出走登録（レース参加）時にも1無量大数をプレゼント！
  if(fn==='enter_horse' && D.p){
    const current = BigInt(D.p.coins || 0);
    D.p.coins = (current + MURYOU_TAISU).toString();
    alert('🏁 出走登録完了！\n🎁 競馬に参加したため【1無量大数🪙】を獲得しました！');
  }
  const {error}=await sb.rpc(fn,a);
  if(error)alert(error.message);
  load();
}

function render(){ if(!me||!D.p)return;
 const T={race,zukan,stable,bets,code};
 $('#app').innerHTML=`<header><b>🏇 GWCG</b><span>${D.p.name}</span><span class=c>🪙${y(D.p.coins)}</span><button onclick="sb.auth.signOut()">ログアウト</button></header>
 <nav>${[['race','レース'],['zukan','馬図鑑・購入'],['stable','馬房'],['bets','馬券履歴'],['code','🎟コード']].map(([k,v])=>`<button class="${st.tab==k?'on':''}" onclick="st.tab='${k}';render()">${v}</button>`).join('')}</nav><main>${T[st.tab]()}</main>`;
 if(st.tab=='race')prev()}

const es=r=>[...r.entries].sort((a,b)=>a.gate-b.gate);
function wo(r){const t=r.entries.reduce((a,e)=>a+e.str,0);return e=>Math.min(9999,Math.max(1.1,Math.round(8/(e.str/t))/10))}
function race(){
 const now=Date.now(),open=D.races.filter(r=>r.status=='open').sort((a,b)=>a.id-b.id),cur=open[0],last=D.races.find(r=>r.status=='done');
 D.last=last&&now-new Date(last.start_at)<30e3?last:null;
 let h='<div style="background:#2a4a38;padding:8px;border-radius:8px;margin-bottom:10px;text-align:center;">🔥 <b>イベント開催中：</b>馬券購入または出走登録で<b>【1無量大数🪙】</b>GET！</div>';
 if(cur){const left=(new Date(cur.start_at)-now)/1000,ph=left>180?'出走登録受付中':left>15?'ベット受付中':'締切';
  if(sel.rid!=cur.id)sel={rid:cur.id,type:sel.type,picks:[],amt:sel.amt};
  const o=wo(cur),canBet=left<=180&&left>15;
  h+=`<div class=card><h3>${cur.name} <small>(1着賞金🪙${y(cur.prize)})</small></h3><div>${ph}:発走まで <b id=cd class=c></b></div>
  <table><tr><th>枠<th>馬名<th>脚質<th>単勝</tr>${es(cur).map(e=>`<tr class="${sel.picks.includes(e.gate)?'sel':''}"><td><span class=n>${e.gate}</span><td>${e.name}${e.owner==me.id?' ⭐':''}<td>${e.style}<td>${o(e)}
  ${canBet?`<td><button onclick="pick(${e.gate})">選択</button>`:''}</tr>`).join('')}</table></div>`;
  if(canBet)h+=`<div class=card>${Object.keys(TN).map(t=>`<button class="${sel.type==t?'on':''}" onclick="sel.type='${t}';sel.picks=[];render()">${TN[t]}</button>`).join('')}
  <div>買い目(${K[sel.type]}頭を${'win'==sel.type?'選択':'着順どおりに選択'}): <b>${sel.picks.join(' → ')||'未選択'}</b> <span class=c id=od></span></div>
  ${[100,500,1000,5000].map(a=>`<button class="${sel.amt==a?'on':''}" onclick="sel.amt=${a};render()">${a}</button>`).join('')}
  <button onclick="bet()">🎫 ベットして1無量大数GET(🪙${y(sel.amt)})</button></div>`;
  else if(left>180)h+=`<p>⏳ 馬房タブから所有馬を出走登録できます(登録で1無量大数プレゼント！)。</p>`}
 if(last){h+=`<div class=card><h3>前回結果:${last.name}</h3>${D.last?'<canvas id=cv></canvas>':''}
  <table>${last.result.map((g,i)=>`<tr><td>${i+1}着<td><span class=n>${g}</span> ${last.entries.find(e=>e.gate==g).name}</tr>`).join('')}</table>
  ${D.bets.filter(b=>b.race_id==last.id).map(b=>`<div>${TN[b.type]} ${b.picks.join('-')} ${b.amount}枚 ${b.odds}倍 → <b class=c>${b.settled?'🪙'+y(b.payout):'集計中'}</b></div>`).join('')}</div>`}
 return h}

function pick(g){const i=sel.picks.indexOf(g);if(i>=0)sel.picks.splice(i,1);else if(sel.picks.length<K[sel.type])sel.picks.push(g);render()}
async function prev(){if(sel.picks.length==K[sel.type]&&$('#od')){const {data}=await sb.rpc('calc_odds',{rid:sel.rid,typ:sel.type,pk:sel.picks});if($('#od'))$('#od').textContent=data+'倍'}}

async function bet(){
  // 競馬（馬券購入）に参加するだけで1無量大数プレゼント！
  if(D.p){
    const current = BigInt(D.p.coins || 0);
    D.p.coins = (current + MURYOU_TAISU).toString();
  }
  const {data,error}=await sb.rpc('place_bet',{rid:sel.rid,typ:sel.type,pk:sel.picks,amt:sel.amt});
  if(error) alert(error.message);
  else {
    alert(`🎉 ベット完了！\n🎁 競馬に参加した特典として【1無量大数🪙】を獲得しました！\n(オッズ: ${data}倍)`);
    sel.picks=[];
  }
  load();
}

const bar=(v,c)=>`<span style="display:inline-block;width:${v*.6}px;height:8px;background:${c}"></span> ${v}`;
function hrow(h,btn){const tw=h.wins_t+h.wins_d,tr=h.runs_t+h.runs_d;
 return `<tr><td>${h.name}<td>${h.style}<td>${bar(h.spd,'#e55')}<td>${bar(h.sta,'#5b5')}<td>${bar(h.pow,'#59f')}<td>${h.turf}/${h.dirt}
 <td>${h.wins_t}-${h.runs_t}<td>${h.wins_d}-${h.runs_d}<td>${tr?Math.round(tw/tr*100):0}%<td>${h.recent.join(',')||'-'}<td>${h.fatigue}<td>${y(h.price)}<td>${btn}</tr>`}
const HEAD='<tr><th>馬名<th>脚質<th>スピード<th>スタミナ<th>パワー<th>芝/ダ適性<th>芝(勝-出)<th>ダ(勝-出)<th>勝率<th>近5走<th>疲労<th>価格<th></tr>';
function zukan(){return `<div style="overflow-x:auto"><table>${HEAD}${D.horses.map(h=>hrow(h,h.owner==me.id?'⭐所有':h.owner?'他人':`<button onclick="if(confirm('購入しますか?'))act('buy_horse',{hid:${h.id}})">購入</button>`)).join('')}</table></div>`}
function stable(){const m=D.horses.filter(h=>h.owner==me.id);if(!m.length)return'<p>所有馬がいません。図鑑から購入しましょう。</p>';
 return m.map(h=>`<div class=card><b>${h.name}</b> ${h.style} 疲労${h.fatigue} 価格🪙${y(h.price)}<table>${HEAD}${hrow(h,'')}</table>
 <button onclick="act('train',{hid:${h.id},stat:'spd'})">スピード強化300</button><button onclick="act('train',{hid:${h.id},stat:'sta'})">スタミナ強化300</button><button onclick="act('train',{hid:${h.id},stat:'pow'})">パワー強化300</button>
 <button onclick="act('enter_horse',{hid:${h.id}})">🏁 出走登録(1無量大数GET)</button><button class=s onclick="if(confirm('売却(価格の60%)'))act('sell_horse',{hid:${h.id}})">売却</button></div>`).join('')}
function bets(){return `<table><tr><th>レース<th>種別<th>買い目<th>金額<th>オッズ<th>払戻</tr>${D.bets.map(b=>`<tr><td>${b.race_id%10000}<td>${TN[b.type]}<td>${b.picks.join('-')}<td>${b.amount}<td>${b.odds}<td>${b.settled?y(b.payout):'待機中'}</tr>`).join('')}</table>`}

// レースアニメーション
const SP={逃げ:.85,先行:.95,差し:1.08,追込:1.2};
setInterval(()=>{const c=$('#cv'),r=D.last;if(!c||!r)return;const E=es(r),g=c.getContext('2d');c.width=760;c.height=E.length*26+10;
 const t=(Date.now()-new Date(r.start_at))/1000;g.font='13px sans-serif';
 E.forEach((e,i)=>{const T=18+r.result.indexOf(e.gate)*.5,u=Math.min(1,Math.max(0,t/T)),x=40+Math.pow(u,SP[e.style]||1)*620,yy=i*26+16;
  g.fillStyle=r.surface=='芝'?'#2f7a3a':'#8a6a3c';g.fillRect(0,yy-11,760,22);g.fillStyle='#fff';g.fillRect(670,yy-11,3,22);
  g.beginPath();g.arc(x,yy,10,0,7);g.fillStyle='#f5c518';g.fill();g.fillStyle='#000';g.fillText(e.gate,x-4,yy+4);g.fillStyle='#fff';g.fillText(e.name,x+14,yy+4)})},60);
setInterval(()=>{const c=$('#cd'),o=D.races.filter(r=>r.status=='open').sort((a,b)=>a.id-b.id)[0];if(c&&o){const s=Math.max(0,Math.floor((new Date(o.start_at)-Date.now())/1000));c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);
setInterval(()=>{if(me&&document.activeElement.tagName!='INPUT')load()},4000);
 function code(){return `<div class=card><h3>🎟 コード入力</h3><p>コードは1アカウントにつき1回、🪙10000です。</p>
<input id=cd2 placeholder="GWCG-XXXXXXXX" style="width:70%"><button onclick="redeem()">決定</button></div>`}
async function redeem(){const v=$('#cd2').value;const {data,error}=await sb.rpc('redeem_code',{c:v});
 if(error)alert(error.message);else alert(data);load()}
</script></body></html>
